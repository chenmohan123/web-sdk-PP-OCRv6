<body><h1>PP-OCRv6 微信 web-view</h1><p>图片仅在当前设备处理。使用 WASM 主线程；初始化期间请等待。</p>

<label>图片 <input id="image" type="file" accept="image/*"></label><button id="run">开始识别</button><button id="cancel">取消</button><pre id="output" aria-live="polite">请选择图片</pre>

<script type="module" src="./main.js"></script></body></html>
