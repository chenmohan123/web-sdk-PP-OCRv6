<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>PP-OCRv6 CDN</title></head><body><input id="file" type="file"><button id="run">OCR</button><pre id="result"></pre><script type="module">import { createOCR } from "https://esm.sh/web-sdk-pp-ocrv6@0.1.5"; document.querySelector("#run").onclick = async () => { const file = document.querySelector("#file").files?.[0]; if (!file) return; const ocr = createOCR({ backend: "wasm", execution: "worker" }); try { document.querySelector("#result").textContent = JSON.stringify(await ocr.ocr(file), null, 2); } finally { await ocr.dispose(); } };</script></body></html>
