schemaVersion: "1.1.0"
id: pp-ocrv6
name: PP-OCRv6 Web SDK
summary: Browser-first PP-OCRv6 OCR SDK with local detection and recognition through ONNX Runtime Web.
package:
  name: web-sdk-pp-ocrv6
  version: 0.1.4
repository: https://github.com/chenmohan123/web-sdk-PP-OCRv6
demo:
  url: https://chenmohan123.github.io/web-sdk-PP-OCRv6/
  defaultLanguage: zh-CN
  framework: react
  localProcessing: true
docs:
  zhCN: docs/zh-CN/quick-start.md
  en: docs/en/quick-start.md
runtime:
  backends: [wasm, webgpu]
  executionModes: [worker, main]
  actualBackendReported: true
  runtimeVersion: onnxruntime-web@1.27.0
model:
  id: pp-ocrv6
  version: 1.0.0
  format: onnx
  parameterCount: null
  precision: [fp32]
  source: Official PaddlePaddle PP-OCRv6 ONNX assets pinned to Hugging Face commit revisions; CORS-enabled Hugging Face URLs are the browser defaults and GitHub Release URLs are the versioned archive sources.
  license: Apache-2.0
  assets:
    - { id: PP-OCRv6_medium_det, bytes: 62032837, precision: fp32, url: https://huggingface.co/PaddlePaddle/PP-OCRv6_medium_det_onnx/resolve/61323801669c338b7891481ec7bac61ce31b576a/inference.onnx, sha256: "eb13b44b25bb36f89528b68720af8a61d9cf381176107f465db1757b65d086e1" }
    - { id: PP-OCRv6_small_det, bytes: 9880512, precision: fp32, url: https://huggingface.co/PaddlePaddle/PP-OCRv6_small_det_onnx/resolve/28fe5895c24fd108c19eb3e8479f4ab385fbfc62/inference.onnx, sha256: "d73e0058b7a8086bbd57f3d10b8bcd4ff95363f67e06e2762b5e814fe9c9410e" }
    - { id: PP-OCRv6_tiny_det, bytes: 1780590, precision: fp32, url: https://huggingface.co/PaddlePaddle/PP-OCRv6_tiny_det_onnx/resolve/2ba1506c0380b8f0b03dd142459aac66d4421f6c/inference.onnx, sha256: "193bab7a04fca699a6c82e6abb5b81bdb28177f0abd4062552b04908dafb19f8" }
    - { id: PP-OCRv6_medium_rec, bytes: 76554979, precision: fp32, url: https://huggingface.co/PaddlePaddle/PP-OCRv6_medium_rec_onnx/resolve/50c7eacafc52fa7bcf4194e8cd08e46f8558504b/inference.onnx, sha256: "9c09abf0957f7968c7586464b7397b84ad2387a0497a351af40e9acc71b673ba" }
    - { id: PP-OCRv6_small_rec, bytes: 21159378, precision: fp32, url: https://huggingface.co/PaddlePaddle/PP-OCRv6_small_rec_onnx/resolve/b8f84f0b80c529de40b4fbb3544b84fa7233a513/inference.onnx, sha256: "5435fd747c9e0efe15a96d0b378d5bd157e9492ed8fd80edf08f30d02fa24634" }
    - { id: PP-OCRv6_tiny_rec, bytes: 4462639, precision: fp32, url: https://huggingface.co/PaddlePaddle/PP-OCRv6_tiny_rec_onnx/resolve/2612ab37152ae0a677521bae4e1e3d4fb4cf7c30/inference.onnx, sha256: "9ef676d6ed3c88256a2d92c640c44f25b0c40947e111b14b8be8f594091563e6" }
performance:
  timings: [modelDownloadMs, modelCacheReadMs, integrityMs, sessionMs, decodeMs, preprocessMs, inferenceMs, postprocessMs, totalMs]
  coldStartDefined: true
  warmRunDefined: true
cache:
  storage: [indexeddb, memory]
  versionedKeys: true
  clearCurrent: true
  clearAll: true
  estimate: true
examples:
  vanilla: { status: runnable, path: examples/vanilla }
  react: { status: runnable, path: examples/react }
  vite: { status: runnable, path: examples/vite }
  cdn: { status: runnable, path: examples/cdn }
  wechatWebView: { status: runnable, path: examples/wechat-web-view }
verification:
  environments: []
