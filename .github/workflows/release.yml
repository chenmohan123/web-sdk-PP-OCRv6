name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的版本标签，例如 v0.1.0"
        required: true
        default: v0.1.0
        type: string

permissions:
  contents: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Release workflow loaded; publication runs only for refs/tags/v*"

  release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: npm
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: git fetch origin main && git merge-base --is-ancestor HEAD origin/main
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: node scripts/verify-release.mjs "$RELEASE_TAG"
      - run: pnpm --filter web-sdk-pp-ocrv6 build
      - run: node scripts/verify-package-assets.mjs
      - name: Publish package with npm Trusted Publisher
        working-directory: packages/sdk
        shell: bash
        run: |
          package_name="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).name")"
          package_version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
            echo "${package_name}@${package_version} 已存在，跳过重复发布。"
          else
            npm publish --access public --provenance
          fi
      - name: Attach immutable model assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          target_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$target_sha" \
              --title "$RELEASE_TAG" \
              --notes-file CHANGELOG.md
          fi
          gh release upload "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            models/pp-ocrv6/1.0.0/*.onnx \
            models/pp-ocrv6/1.0.0/manifest.json
